<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disney API</title>

    <style>
        body{
            text-align:center;
        }
        img{
            width:250px;
            margin-top:20px;
        }
    </style>

</head>
<body>

<h1>Disney Characters API</h1>
    <input type="text" id="character" placeholder="Enter character name">
    <button id="add">Search</button>
    <h2 id="name"></h2>
    <img id="picture">

<script>

    document.getElementById("add").addEventListener("click", function(){
        let characterName = document.getElementById("character").value;
        let url = "https://api.disneyapi.dev/character";
        fetch(url)

            .then(function(response){
                return response.json();
            })

            .then(function(data){
                console.log(data);
                let characters = data.data;
                let foundCharacter = characters.find(function(character){
                    return character.name.toLowerCase() === characterName.toLowerCase();
                });

                if(foundCharacter){
                    document.getElementById("name").innerHTML = foundCharacter.name;

                    document.getElementById("picture").src = foundCharacter.imageUrl;

                } else {

                    document.getElementById("name").innerHTML = "Character not found";
                    document.getElementById("picture").src = "";

                }
            });
    });

    //some working inputs: achilles, 90's Adventure Bear, Prince Axel, Baloo,

</script>

</body>
</html>
