<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do</title>
</head>
<body>

    <h1> School <span class="animated">TO-DO</span> List </h1>
    <h3>Add a task:</h3>
    <label>Type here: <input type="text" id="task"></label>
    <button id="add" onclick="new_task()">Add</button>

    <div id="entry">

</body>
<style>

    .animated{
        display: inline-block;
    }
    .animated:hover{
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% {transform: scale(1);
        }
        50% {transform: scale(1.1);
        }
        100% {transform: scale(1);
        }
        from{color:#c3b1e1;}
        to{color:mediumvioletred;}
    }

    h1 {
        color: #c3b1e1;
        text-align: center;
        font-family: "Comic Sans MS";
    }

    h4 {
        font-family: "Comic Sans MS";

    }

    h3{
        font-family: "Comic Sans MS";
    }

    body{
        margin: 0;
        font-family: "Comic Sans MS";
        background: rgba(217, 204, 248, 0.48);
        border:30px solid rgba(194, 172, 239, 0.48);
        padding: 10px;
        padding-bottom: 550px;

    }

    button{
       margin-bottom: 17px;
    }

    #entry > div{
        font-weight: bold;
        padding-left: 55px;
        background-color: white;
        width: 80%;
        border-radius:10px;
        padding: 15px;
        margin-bottom: 10px;
    }

    div{
        padding-left: 35px;
    }

    input[type="checkbox"]:checked + span {
        color: red;
        text-decoration: line-through;
    }


</style>

<script>

<!--    document.getElementById("task").innerText = task_name;-->


    function new_task() {

        let task = document.getElementById("task");
        let task_name = task.value;

        if(task_name == ""){
            return false;
        }
        console.log(task);

        let new_h4 = document.createElement("div");
        document.getElementById("entry").appendChild(new_h4);

        let checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        new_h4.appendChild(checkbox);

        let span = document.createElement("span");
        span.innerText = " " + task_name;
        new_h4.appendChild(span);

        let trash = document.createElement("span");
        trash.className = "trash";
        trash.innerText = "🗑️";
        trash.style.float = "right";
        trash.addEventListener("click", delete_task);
        new_h4.appendChild(trash);


        task.value = "";
        task.focus();
        setCookie("task", + Date.now(), task_name);
    }

    function delete_task(e) {
        e.target.parentElement.remove();
    }

    function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays*24*60*60*1000));
        let expires = "expires="+ d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
    }

</script>
</html>
