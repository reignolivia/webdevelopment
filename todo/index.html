<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do</title>
</head>
<body>

    <h1> School <span class="animated">TO-DO</span> List </h1>
    <h3>Add a task:</h3>
    <label>Type here: <input type="text" id="task"></label>
    <button id="add" onclick="new_task()">Add</button>
    <div id="entry">
    </div>

</body>
<style>

    .animated{
        display: inline-block;
    }
    .animated:hover{
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% {transform: scale(1);
        }
        50% {transform: scale(1.1);
        }
        100% {transform: scale(1);
        }
        from{color:#c3b1e1;}
        to{color:mediumvioletred;}
    }

    h1 {
        color: #c3b1e1;
        text-align: center;
        font-family: "Comic Sans MS";
    }

    h4 {
        font-family: "Comic Sans MS";

    }

    h3{
        font-family: "Comic Sans MS";
    }

    body{
        margin: 0;
        font-family: "Comic Sans MS";
        background: rgba(217, 204, 248, 0.48);
        border:30px solid rgba(194, 172, 239, 0.48);
        padding: 10px;
        padding-bottom: 550px;

    }

    button{
       margin-bottom: 17px;
    }

    #entry > div{
        font-weight: bold;
        padding-left: 55px;
        background-color: white;
        width: 80%;
        border-radius:10px;
        padding: 15px;
        margin-bottom: 10px;
    }

    #entry > div:hover {
        background-color: rgba(228, 228, 228, 0.48);
    }

    div{
        padding-left: 35px;
    }

    input[type="checkbox"]:checked + span {
        color: #e8e8e8;
        text-decoration: line-through;
    }


</style>

<script>
    function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays*24*60*60*1000));
        let expires = "expires="+ d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
    }

    function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(';');
        for(let i = 0; i <ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return "";
    }
    function new_task() {
        let task_input = document.getElementById("task");
        let task = document.getElementById("task");
        let task_name = task.value;

        if (task_name == "") {
            return false;
        }
        console.log(task_name);
        setCookie("task", getCookie("task") + "|" + task_name, 15);
        add_task(task_name);

        task_input.value = "";
        task_input.focus();
    }

        function add_task(task_name){
            let new_div = document.createElement("div");
            new_div.className = "task";
            document.getElementById("task").appendChild(new_div);

        let new_h4 = document.createElement("div");
        document.getElementById("entry").appendChild(new_h4);

        let checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        new_h4.appendChild(checkbox);

        let span = document.createElement("span");
        span.innerText = " " + task_name;
        new_h4.appendChild(span);

        let trash = document.createElement("span");
        trash.className = "trash";
        trash.innerText = "🗑️";
        trash.style.float = "right";
        trash.addEventListener("click", delete_task);
        new_h4.appendChild(trash);

        let star = document.createElement("span");
        star.className = "star";
        star.innerText = "⭐️";
        star.style.float = "right";
        star.style.paddingRight = "20px";
        star.addEventListener("click", priority_task);
        new_h4.appendChild(star);

        let date = document.createElement("span");
        date.className = "date";
        date.innerText = "🗓️";
        date.style.float = "right";
        date.style.paddingRight = "320px";
        date.addEventListener("click", calendar);
        new_h4.appendChild(date);

    }

    function calendar(e){
        e.target.parentElement.date
    }
    function priority_task(e) {
        e.target.parentElement.style.backgroundColor = "rgba(184,172,234,0.48)";
        e.target.parentElement.translateUp = "5px";
        let taskDiv = e.target.parentElement;
        let container = document.getElementById("entry");

        if (taskDiv.classList.contains("priority")) {
            taskDiv.classList.remove("priority");
            taskDiv.style.backgroundColor = "white";
            container.appendChild(taskDiv);
        } else {
            taskDiv.classList.add("priority");
            taskDiv.style.backgroundColor = "rgba(184,172,234,0.48)";
            container.prepend(taskDiv);

        }
    }

    function delete_task(e) {
        e.target.parentElement.remove();
    }

    let current_cookie = getCookie("task");
    current_cookie = current_cookie.split("|");
    console.log(current_cookie);

    for(let i = 0; i < current_cookie.length; i = i + 1){
        console.log(current_cookie[i]);
        add_task(current_cookie[i]);
    }

</script>
</html>
