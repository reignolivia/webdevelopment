<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Keyboard Cipher</title>
</head>

    <body>

    <h1 class="pulse">Keyboard Layout Caesar Cipher</h1>
    <label for="key">Select a keyboard layout:</label>

    <select id="key">
        <option value="Regular">Regular</option>
        <option value="QWERTY">QWERTY</option>
    </select>

    <p>
        <label for="plaintext">Enter your message:</label>
        <input type="text" id="plaintext" value="Hello">
    </p>
    <a href="../index.html">Back to Home</a>
    <p>
        <button onclick="encode()">Encode</button>
    </p>
    <p id="ciphertext"></p>

    <script>
        function encode(){

            let key = document.getElementById("key").value;
            let text = document.getElementById("plaintext").value.toUpperCase();

            let alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            let layouts = {
                "Regular": "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
                "QWERTY": "QWERTYUIOPASDFGHJKLZXCVBNM",
            };

            let result = "";

            let cipher = layouts[key];

            if(key === "Regular"){

                cipher = layouts["QWERTY"];
            }

            for(let i = 0; i < text.length; i++){

                let char = text[i];

                let index;

                if(key === "Regular"){

                    index = cipher.indexOf(char);
                    result += (index === -1) ? char : alphabet[index];

                }
                else {

                    index = alphabet.indexOf(char);
                    result += (index === -1) ? char : cipher[index];
                }
            }

            document.getElementById("ciphertext").innerText = result;
        }

    </script>
    <style>
        h1{
            color: rgba(199, 182, 244, 0.94);
            text-align: center;
            font-family: Optima;
        }
        @keyframes pulse {
            0% { transform: scale3d(1, 1, 1); }
            50% { transform: scale3d(1.05, 1.05, 1.05); }
            100% { transform: scale3d(1, 1, 1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
        body{
            background-color: #e7e7f3;
        }
        p {
            font-family: Optima;
        }
        label {
            font-family: Optima;
        }
        a{
            font-family: Optima;
            color: rebeccapurple;
            padding-top: 100px;
        }
    </style>
    </body>
</html>
