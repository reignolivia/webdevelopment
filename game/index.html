<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ice Cream Clicker Game</title>
</head>
  <body>
  <h1 class="ColorText">Ice Cream Clicker</h1>

  <h3 class="pulse">Next flavor: Chocolate</h3>

  <div>
    <p>Add rainbow sprinkles</p>
    <p>Add chocolate chips</p>
    <!--    <p style="margin-left: 480px">2x clicker</p>-->
    <p>Add cherry</p>
    <!-- add 2x clicker -->
  </div>

  <br>
  <div class="images">
  <img id="iceCream" class="center" src="https://i.imgur.com/AbJXUaW.png" alt="vanilla ice cream">
  </div>

  <h3 id="choco" class="unlockChocolate">$2000 for Chocolate Ice cream!</h3>
  <h2 id="money">$0</h2>

  </body>
</html>
<style>
  body {
    background: #fadaf9;
  }

  h1{
    text-align: center;
    font-family: "Comic Sans MS", cursive;
  }

  h3{
    text-align: center;
    font-family: "Comic Sans MS", cursive;

  }

  h2{
    text-align: right;
    margin-right: 30px;
    font-family: "Comic Sans MS", cursive;
    font-size: 40px;
  }

  p{
    font-family: "Comic Sans MS", cursive;
  }

  .ColorText {
    animation: changeColor 5s infinite;
  }

  .pulse{
    animation: pulse 2s infinite;
  }

  .center{
    display: block;
    width: 400px;
    height: 400px;
    margin: 0 auto;
    transition: transform 0.2s ease;
    cursor: pointer;
  }

  .center:hover{
    transform: scale(1.1);
  }

  .unlockChocolate{
    background-color: rosybrown;
    border-radius: 20px;
    width: 300px;
    padding: 30px;
    margin-left: 550px;
    animation: glow 1s infinite alternate;
  }

  .clicked{
    animation: clickBounce 0.2s ease;
  }

  @keyframes changeColor {
    from{color: rgb(255, 248, 187);}
    to{color: #ef73ec;}

  }

  @keyframes glow{
    from{
      box-shadow: 0 0 5px rosybrown;
    }
    to{
      box-shadow: 0 0 25px rgba(154, 103, 103, 0.47);
    }
  }

  @keyframes pulse {
    0% { transform: scale3d(1, 1, 1); }
    50% { transform: scale3d(1.05, 1.05, 1.05); }
    100% { transform: scale3d(1, 1, 1); }
  }

  @keyframes clickBounce{
    0%{
      transform: scale(1);
    }
    50%{
      transform: scale(1.2);
    }
    100%{
      transform: scale(1);
    }
  }

</style>
<script>

  let money = 1990;
  let clickValue = 1;
  let chocolateUnlocked = false;

  let iceCream = document.getElementById("iceCream");
  let moneyText = document.getElementById("money");

  let nextFlavorText = document.querySelector(".pulse");
  let unlockBox = document.getElementById("choco");


  iceCream.addEventListener("click", function(){
    money = money + clickValue;

    moneyText.textContent = "$" + money;

    iceCream.classList.add("clicked");

    setTimeout(() => {
      iceCream.classList.remove("clicked");
    }, 150);

  });

  //chocolate level box
  unlockBox.addEventListener("click", function(){

    // check if player has enough money
    if(money >= 2000 && chocolateUnlocked === false){

      chocolateUnlocked = true;
      money = money - 2000;
      moneyText.textContent = "$" + money;

      //change all the elements for the next level
      iceCream.src = "https://i.imgur.com/ZVK9lKU.png";

      nextFlavorText.textContent = "Next flavor: Dulce de Leche";
      clickValue = 4;

      unlockBox.textContent = "$10,000 for Dulce de Leche!";
      unlockBox.style.backgroundColor = "#d59a5f";
      unlockBox.style.boxShadow = "0 0 20px orange";

    }

  });

</script>
