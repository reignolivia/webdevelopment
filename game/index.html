<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game</title>
</head>
  <body>
  <h1 class="ColorText">Ice Cream Clicker</h1>

  <h3 class="pulse">Next flavor: Strawberry</h3>

  <div>
    <p>Add chocolate chips</p>
<!--    <p style="margin-left: 480px">2x clicker</p>-->
    <p>Add rainbow sprinkles</p>
    <p>Add cherry</p>
  </div>

  <br>
  <div class="images">
  <img id="iceCream" class="center" src="https://i.imgur.com/AbJXUaW.png" alt="vanilla ice cream">
  </div>

  <h2 id="money">$0</h2>

  </body>
</html>
<style>
  body {
    background: #fadaf9;
  }

  h1{
    text-align: center;
    font-family: "Comic Sans MS", cursive;
  }

  h3{
    text-align: center;
    font-family: "Comic Sans MS", cursive;

  }

  h2{
    text-align: right;
    margin-right: 30px;
    font-family: "Comic Sans MS", cursive;
    font-size: 40px;
  }

  p{
    font-family: "Comic Sans MS", cursive;
  }

  .ColorText {
    animation: changeColor 5s infinite;
  }

  .pulse{
    animation: pulse 2s infinite;
  }

  .center{
    display: block;
    width: 400px;
    height: 400px;
    margin: 0 auto;
    transition: transform 0.2s ease;
    cursor: pointer;
  }

  .center:hover{
    transform: scale(1.1);
  }

  .clicked{
    animation: clickBounce 0.2s ease;
  }

  @keyframes changeColor {
    from{color: rgb(255, 248, 187);}
    to{color: #ef73ec;}

  }

  @keyframes pulse {
    0% { transform: scale3d(1, 1, 1); }
    50% { transform: scale3d(1.05, 1.05, 1.05); }
    100% { transform: scale3d(1, 1, 1); }
  }

  @keyframes clickBounce{
    0%{
      transform: scale(1);
    }
    50%{
      transform: scale(1.2);
    }
    100%{
      transform: scale(1);
    }
  }

</style>
<script>

  let money = 0;

  let iceCream = document.getElementById("iceCream");
  let moneyText = document.getElementById("money");
  iceCream.addEventListener("click" , function(){
    money ++;
    moneyText.textContent = "$" + money;

    iceCream.classList.add("clicked"); //classList control CSS classes w Java

    setTimeout(() => { //setTimeout is a timer 150 is milliseconds
      iceCream.classList.remove("clicked");
    }, 150);
  });
</script>
