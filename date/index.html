<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Date</title>
</head>
<body>
    <h1 class="ColorText">Countdown to Olivia's 17th</h1>
    <br>
    <h2 class="pulse" id="countdown">Time Left:</h2>
    <br>
    <a href="../index.html">Back to Home</a>
</body>
    <script>
        let now = new Date();
        // console.log("Now: " + now);

        let then = new Date("10/22/2026 03:28:00");
        // console.log("Then:" + then);

        let days = (then - (now / 1000 / 60 / 60 / 24));

        document.getElementById("countdown").textContent = "Time Left: " + days;
    </script>
    <style>
        h1{
            text-align: center;
            color: rgba(194, 172, 239, 0.48);
            font-family: "Comic Sans MS";
            padding : 20px;
            background-color: rgba(96, 82, 165, 0.48);
            border-radius: 15px;
        }

        h2{
            text-align: center;
            color: #000000;
        }

        body{
            background-color: rgba(96, 82, 165, 0.48);
        }

        @keyframes changeColor {
            from{color: rgba(194, 172, 239, 0.48);}
            to{color: #4200ff;}
        }

        @keyframes pulse {
            0% { transform: scale3d(1, 1, 1); }
            50% { transform: scale3d(1.05, 1.05, 1.05); }
            100% { transform: scale3d(1, 1, 1); }
        }

        .ColorText {
            animation: changeColor 3s infinite;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        a{
            font-family: Optima;
            color: rebeccapurple;
            padding-top: 100px;
            padding-left: 10px;
        }
    </style>
</html>
